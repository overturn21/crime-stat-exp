<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crime Stat Explorer</title>

<style>
body {
font-family: Arial, sans-serif;
background: #f4f6f8;
color: #1f2933;
margin: 0;
}

header {
background: #17202a;
color: white;
padding: 30px;
}

header h1 {
margin: 0;
}

header p {
color: #cbd5e1;
}

.container {
max-width: 1100px;
margin: 40px auto;
padding: 0 20px;
}

.box {
background: white;
padding: 25px;
border-radius: 12px;
margin-bottom: 25px;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.controls {
display: flex;
gap: 15px;
flex-wrap: wrap;
}

select, button {
padding: 12px;
font-size: 15px;
border-radius: 8px;
}

select {
border: 1px solid #ccc;
}

button {
background: #17202a;
color: white;
border: none;
cursor: pointer;
}

.stats {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 20px;
}

.stat {
background: white;
padding: 25px;
border-radius: 12px;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.stat h3 {
color: #64748b;
font-size: 14px;
}

.number {
font-size: 28px;
font-weight: bold;
}
</style>
</head>

<body>

<header>
<h1>Crime Stat Explorer</h1>
<p>Explore FBI crime statistics.</p>
</header>

<div class="container">

<div class="box">
<h2>Search Crime Data</h2>

<div class="controls">

<select id="state">
<option>United States</option>
</select>

<select id="crime">
<option>Burglary</option>
<option>Robbery</option>
<option>Larceny</option>
<option>Motor Vehicle Theft</option>
</select>

<select id="year">
<option>2024</option>
</select>

<button onclick="exploreData()">
Explore Statistics
</button>

</div>
</div>

<div class="stats">

<div class="stat">
<h3>Reported Offenses</h3>
<div class="number" id="offenses">—</div>
</div>

<div class="stat">
<h3>Rate per 100,000</h3>
<div class="number" id="rate">—</div>
</div>

<div class="stat">
<h3>Year</h3>
<div class="number" id="selectedYear">—</div>
</div>

<div class="stat">
<h3>Location</h3>
<div class="number" id="selectedState">—</div>
</div>

</div>

<div class="box">
<h2>Crime Overview</h2>
<p id="message">
Choose a crime and click Explore Statistics.
</p>
</div>

</div>

<script>

let crimeData = {};

fetch("crime-data.json")
.then(response => response.json())
.then(data => {
crimeData = data;
})
.catch(error => {
console.error("Could not load crime data:", error);
});


function exploreData() {

const state = document.getElementById("state").value;
const crime = document.getElementById("crime").value;
const year = document.getElementById("year").value;

const result =
crimeData[state] &&
crimeData[state][year] &&
crimeData[state][year][crime];

document.getElementById("selectedState").textContent = state;
document.getElementById("selectedYear").textContent = year;

if (result) {

document.getElementById("offenses").textContent =
result.offenses.toLocaleString();

document.getElementById("rate").textContent =
result.rate.toLocaleString();

document.getElementById("message").textContent =
`${crime} in ${state} during ${year}.`;

} else {

document.getElementById("offenses").textContent = "N/A";
document.getElementById("rate").textContent = "N/A";

document.getElementById("message").textContent =
"No data available for this selection.";
}
}

</script>

</body>
</html>
